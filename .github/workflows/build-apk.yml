name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go tests
        run: cd go-src && go vet ./... && go test ./...

      # Cross-compile the gateway. It ships as libwb2hub.so because Android 10+
      # refuses to execute anything outside nativeLibraryDir, and a plain file
      # name would be rejected by the packager before that. See the
      # useLegacyPackaging note in app/build.gradle for the other half.
      #
      # CGO_ENABLED=0 yields a static binary with no libc dependency, so no NDK
      # sysroot is needed.
      - name: Cross-compile embedded gateway (Android arm64)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd go-src
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o ../app/src/main/jniLibs/arm64-v8a/libwb2hub.so \
            ./cmd/server
          file ../app/src/main/jniLibs/arm64-v8a/libwb2hub.so || true
          SIZE=$(stat -c%s ../app/src/main/jniLibs/arm64-v8a/libwb2hub.so)
          echo "gateway binary: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::binary too small ($SIZE B) — build likely failed"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/WB2Hub-Lite.apk
          ls -la out/

      # A missing gateway makes the app install and then fail at runtime, which
      # is far more confusing than a red build.
      - name: Verify embedded gateway
        run: |
          set -e
          APK=out/WB2Hub-Lite.apk
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libwb2hub.so"; then
            echo "gateway binary is packaged"
          else
            echo "::error::APK is missing lib/arm64-v8a/libwb2hub.so"
            exit 1
          fi
          unzip -l "$APK" | grep -E "lib/|\.dex" || true

      # AGP 8.x writes only the v2/v3 signature block, so META-INF/*.RSA is not
      # present and cannot be used as the signature check.
      - name: Verify signature
        run: |
          APK=out/WB2Hub-Lite.apk
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner 2>/dev/null | sort -rV | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            grep -qa "APK Sig Block 42" "$APK" && echo "signature block present"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WB2Hub-Lite-APK
          path: out/WB2Hub-Lite.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/WB2Hub-Lite.apk
