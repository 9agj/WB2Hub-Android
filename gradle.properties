org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# NOTE: android.aapt2FromMavenOverride is deliberately NOT set here.
#
# On this arm64 host the SDK/AGP aapt2 is an x86-64 binary and has to run under
# qemu-user, but the shim that does that is local machine setup. Setting the
# path in the project breaks every other machine: an x86-64 CI runner has no
# /opt/aapt2-shim and dies with
#   Specified AAPT2 executable does not exist: /opt/aapt2-shim/aapt2
#
# The override therefore lives in the user-level ~/.gradle/gradle.properties,
# which Gradle merges on top of this file. Do not move it back here.
